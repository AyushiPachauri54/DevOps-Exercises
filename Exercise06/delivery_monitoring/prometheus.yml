global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "delivery_service"
    static_configs:
      # 172.17.0.1 = docker0 bridge IP of the host on Linux/WSL.
      # On Docker Desktop (Mac/Windows) use host.docker.internal:8000
      - targets: ["172.17.0.1:8000"]

rule_files:
  # the manual's file was called alert_rules.yml in one place and alerts_rules.yml in another -> we use alert_rules.yml everywhere
  - /etc/prometheus/alert_rules.yml
